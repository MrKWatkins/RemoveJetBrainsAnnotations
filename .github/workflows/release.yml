name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version without v; blank increments the latest stable tag minor version
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: MrKWatkins/build/dotnet/project@main
        with:
          version: ${{ inputs.version }}
          docs: 'false'
          publish-packages: 'true'
